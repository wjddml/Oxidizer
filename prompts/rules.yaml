# Oxidizer C-to-Rust Translation Rules Database
# 규칙을 추가할 때는 아래 포맷(name, description, few_shot)을 유지해 주세요.

rules:
  - name: "Semantic Lifting for Pointers"
    description: "Replace raw pointers (*mut T, *const T) with safe Rust types. If a pointer is used as an array, use slice &[T] or &mut [T]."
    few_shot: |
      [C] void process(int *arr, int len) { arr[0] = 1; }
      [Rust] pub fn process(arr: &mut [i32]) { arr[0] = 1; }

  - name: "Zero Unsafe"
    description: "Remove ALL `unsafe` blocks. Do NOT use `libc` functions if safe Rust standard library equivalents exist."
    few_shot: "" # 예시가 필요 없는 규칙은 비워둡니다.