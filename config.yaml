# config.yaml
project:
  name: "Oxidizer"

paths:
  prompts_dir: "prompts"
  data_dir: "data"

llm:
  provider: "gemini"         # 향후 gpt, claude 등으로 변경 가능
  model: "gemini-2.5-pro"
  temperature: 0.2           # 기존 설정값 유지

agent:
  max_retries: 5             # 구문(Syntax) 및 의미(Semantic) 수리 최대 재시도 횟수
  timeout_seconds: 60        # Cargo 빌드/체크 타임아웃
  memory_limit_mb: 1024      # 테스트/빌드 메모리 제한 (OOM 방지)